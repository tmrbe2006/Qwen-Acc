  c.innerHTML='<div class="card"><div class="panel-head"><h2>المستخدمون</h2><div class="spacer"></div>'+
    '<button class="btn primary" onclick="Views._userForm(null)">+ مستخدم جديد</button></div>'+
    '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>الاسم</th><th>اسم المستخدم</th><th>الدور</th><th>الصلاحيات</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>'+
    (users.map(u=>"<tr><td>"+esc(u.name)+"</td><td>"+esc(u.username)+"</td><td>"+(u.role==="admin"?"مدير":"مستخدم")+"</td><td>"+(u.perms&&u.perms.includes("*")?"<span class=\"tag gr\">كل الصلاحيات</span>":"<span class=\"tag gy\">"+((u.perms||[]).length)+" وحدة</span>")+'</td><td><span class="tag '+(u.active===false?"cr":"gr")+'">'+(u.active===false?"موقوف":"نشط")+'</span></td>'+
      '<td style="white-space:nowrap"><button class="btn ghost sm" onclick="Views._userForm(\''+u.id+'\')">تعديل</button> '+(u.username!=="admin"?'<button class="btn danger sm" onclick="Views._delUser(\''+u.id+'\')">حذف</button>':"")+"</td></tr>").join("")||'<tr><td colspan="6">لا يوجد مستخدمون</td></tr>')+
    "</tbody></table></div></div>";
};
Views._userForm=async function(id){
  if(!App.guardWrite())return;
  if(App.user.role!=="admin"&&id!==App.user.id){toast("تعديل المستخدمين للمدير فقط","err");return;}
  const u=id?await DB.get("users",id):{name:"",username:"",password:"",role:"user",perms:["dashboard"],active:true};
  openModal(id?"تعديل مستخدم":"مستخدم جديد",
    '<div class="row"><div class="field"><label>الاسم الكامل *</label><input id="usName" value="'+esc(u.name||"")+'"></div>'+
    '<div class="field"><label>اسم المستخدم *</label><input id="usUser" value="'+esc(u.username||"")+'" '+(u.username==="admin"?"readonly":"")+"></div></div>"+
    '<div class="row"><div class="field"><label>كلمة المرور '+(id?"(اتركها فارغة للإبقاء)":"*")+'</label><input type="password" id="usPass"></div>'+
    '<div class="field"><label>الدور</label><select id="usRole"><option value="user" '+(u.role==="user"?"selected":"")+'">مستخدم</option><option value="admin" '+(u.role==="admin"?"selected":"")+'">مدير</option><option value="viewer" '+(u.role==="viewer"?"selected":"")+'">اطلاع فقط</option></select></div>'+
    '<div class="field"><label>الحالة</label><select id="usActive"><option value="1" '+(u.active!==false?"selected":"")+'">نشط</option><option value="0" '+(u.active===false?"selected":"")+'">موقوف</option></select></div></div>'+
    '<div class="field"><label>الصلاحيات (الوحدات المسموح بها)</label><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border:1px solid #cbd5e1;border-radius:9px;padding:10px;max-height:180px;overflow:auto">'+
      ALL_PERMS.map(p=>'<label style="font-weight:400;font-size:12.5px"><input type="checkbox" class="permChk" value="'+p+'" '+((u.perms||[]).includes("*")||(u.perms||[]).includes(p)?"checked":"")+"> "+(App.TITLES[p]||p)+"</label>").join("")+
    "</div></div>",
    '<button class="btn ghost" onclick="closeModal()">إلغاء</button><button class="btn primary" id="usSave">حفظ</button>');
  $("#usSave").onclick=async()=>{
    const name=$("#usName").value.trim(),username=$("#usUser").value.trim();
    if(!name||!username){toast("الاسم واسم المستخدم مطلوبان","err");return;}
    const pass=$("#usPass").value;
    if(!id&&!pass){toast("كلمة المرور مطلوبة","err");return;}
    const all=await DB.all("users");
    if(all.some(x=>x.username===username&&x.id!==id)){toast("اسم المستخدم مستخدم بالفعل","err");return;}
    const perms=[...document.querySelectorAll(".permChk:checked")].map(x=>x.value);
    const obj={id:id||("u_"+uid()),name,username,password:pass||u.password,role:$("#usRole").value,perms,active:$("#usActive").value==="1"};
    await DB.add("users",obj);
    await audit(id?"user_edit":"user_add",username);
    closeModal();toast("تم حفظ المستخدم");App.refresh();
  };
};
Views._delUser=function(id){
  if(!App.guardWrite())return;
  confirmDialog("حذف المستخدم؟",async()=>{
    const u=await DB.get("users",id);
    if(u&&u.username==="admin"){toast("لا يمكن حذف المستخدم الرئيسي","err");return;}
    await DB.del("users",id);await audit("user_delete",id);toast("تم الحذف");App.refresh();
  });
};

/* ---------- سجل العمليات ---------- */

  c.innerHTML='<div class="card"><div class="panel-head"><h2>سجل العمليات (آخر 400)</h2><div class="spacer"></div>'+
    '<input class="search" id="auSearch" placeholder="بحث…" style="max-width:240px"></div>'+
    '<div class="tbl-wrap"><table class="tbl" id="auTbl"><thead><tr><th>التوقيت</th><th>المستخدم</th><th>العملية</th><th>التفاصيل</th></tr></thead><tbody>'+
    (logs.map(l=>'<tr data-s="'+esc(l.action+" "+l.detail+" "+l.user)+'"><td>'+new Date(l.ts).toLocaleString("ar-EG")+"</td><td>"+esc(l.user)+"</td><td><span class=\"tag gy\">"+esc(l.action)+"</span></td><td>"+esc(l.detail)+"</td></tr>").join("")||'<tr><td colspan="4">السجل فارغ</td></tr>')+
    "</tbody></table></div></div>";
  $("#auSearch").oninput=e=>{const q=e.target.value.toLowerCase();

};

/* ---------- النسخ الاحتياطي ---------- */
Views.backup=async function(c){
  c.innerHTML='<div class="grid g2" style="max-width:900px">'+
    '<div class="card"><div class="panel-head"><h2>نسخ احتياطي وتصدير</h2></div>'+
      '<p class="kpi-note">احفظ نسخة كاملة من قاعدة البيانات (كل الوحدات والقيود) في ملف JSON واحد.</p>'+
      '<button class="btn primary" onclick="Views._exportBackup()">⇩ Backup / Export (JSON)</button></div>'+
    '<div class="card"><div class="panel-head"><h2>استعادة واستيراد</h2></div>'+
      '<p class="kpi-note">استعادة البيانات من ملف JSON — <b style="color:#dc2626">سيتم استبدال كل البيانات الحالية!</b></p>'+
      '<input type="file" id="impFile" accept=".json,application/json" class="hidden">'+
      '<button class="btn warn" onclick="document.getElementById(\'impFile\').click()">⇧ Restore / Import (JSON)</button></div>'+
    '</div>'+
    '<div class="card" style="margin-top:14px;max-width:900px"><div class="panel-head"><h2>المزامنة السحابية — Firebase</h2></div>'+
      '<p class="kpi-note">يعمل النظام دون اتصال عبر IndexedDB، وعند التفعيل تتم مزامنة التغييرات تلقائيًا مع Firestore (آخر كتابة تفوز).</p>'+
      '<p class="kpi-note" id="syncInfo">…</p>'+
      '<label style="display:flex;align-items:center;gap:8px;margin:8px 0;cursor:pointer"><input type="checkbox" id="syncChk" style="width:18px;height:18px"> <b>تفعيل المزامنة السحابية</b></label>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="syncNowBtn">⟳ مزامنة الآن</button></div>'+
    '</div>'+
    '<div class="card" style="margin-top:14px;max-width:900px"><div class="panel-head"><h2>بيانات تجريبية</h2></div>'+
      '<p class="kpi-note">إضافة فواتير وسندات تجريبية فوق البيانات الحالية (للتجربة والعرض).</p>'+
      '<button class="btn ghost" onclick="Views._seedDemo()">+ إنشاء بيانات تجريبية</button></div>';
  $("#impFile").onchange=e=>Views._importBackup(e.target.files[0]);
  await Views._renderSyncInfo();
  const chk=$("#syncChk");
  chk.checked=(await getSetting("syncEnabled"))==="1";
  chk.onchange=async()=>{
    const on=chk.checked;
    if(on&&!Sync.configValid()){
      chk.checked=false;
      toast("أدخل بيانات مشروع Firebase أولًا في ثابت FIREBASE_CONFIG داخل الملف","err");
      return;
    }
    try{
      await Sync.setEnabled(on);
      toast(on?"تم تفعيل المزامنة السحابية":"تم إيقاف المزامنة السحابية");
      await Views._renderSyncInfo();
    }catch(e){chk.checked=false;toast("فشل: "+e.message,"err");}
  };
  $("#syncNowBtn").onclick=async()=>{
    if(!Sync.enabled){toast("فعّل المزامنة أولًا","err");return;}
    if(!navigator.onLine){toast("لا يوجد اتصال بالإنترنت","err");return;}
    try{await Sync.markAll();await Sync.pushAll(false);toast("تمت المزامنة");await Views._renderSyncInfo();}
    catch(e){toast("فشل المزامنة: "+e.message,"err");}
  };
};
Views._renderSyncInfo=async function(){
  const box=$("#syncInfo");if(!box)return;
  const last=await getSetting("lastSync");
  if(!Sync.configValid()){
    box.innerHTML='<b style="color:#b45309">⚠ غير مُهيأ:</b> افتح الملف والصق بيانات مشروعك في ثابت <code>FIREBASE_CONFIG</code> (apiKey و projectId …) ثم أعد التحميل.';
    return;
  }
  box.innerHTML='الحالة: '+(Sync.enabled?'<b style="color:#166534">مُفعّلة</b>':'<b style="color:#334155">متوقفة</b>')+
    ' — المشروع: <code>'+esc(FIREBASE_CONFIG.projectId)+'</code>'+
    (last?' — آخر مزامنة: '+esc(new Date(Number(last)).toLocaleString("ar-EG")):'');
};
Views._exportBackup=async function(){
  try{
    const data=await DB.exportAll();
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const a=el("a",{href:URL.createObjectURL(blob),download:"egy-accounting-backup-"+today()+".json"});
    document.body.appendChild(a);a.click();a.remove();
    await audit("backup","تصدير نسخة احتياطية");
    toast("تم تصدير النسخة الاحتياطية بنجاح");
  }catch(e){toast("فشل التصدير: "+e.message,"err");}
};
Views._importBackup=function(file){
  if(!file)return;
  confirmDialog("سيتم استبدال جميع البيانات الحالية بملف النسخة الاحتياطية. هل أنت متأكد؟",async()=>{
    try{
      const text=await file.text();
      const payload=JSON.parse(text);
      if(!payload.data)throw new Error("الملف لا يحتوي على بنية النسخة الاحتياطية");
      await DB.importAll(payload);
      // إعادة بناء خريطة الحسابات القياسية إن وجدت
      (await DB.all("accounts")).forEach(a=>{ACC_BY_CODE[a.code]=a.id;});
      await audit("restore","استعادة نسخة احتياطية من ملف");
      toast("تمت الاستعادة بنجاح — سيتم إعادة التحميل");
      setTimeout(()=>location.reload(),1200);
    }catch(e){toast("فشل الاستيراد: "+e.message,"err");}
  },"استعادة البيانات");
};
Views._seedDemo=async function(){
  if(!App.guardWrite())return;
  confirmDialog("سيتم إضافة حركات تجريبية (فواتير، سندات، مخزون) فوق البيانات الحالية. متابعة؟",async()=>{
    try{await seedDemo();toast("تم إنشاء البيانات التجريبية");App.go("dashboard");}
    catch(e){toast("فشل: "+e.message,"err");}
  });
};

/* ===================== BOOTSTRAP ===================== */
(async function boot(){
  try{
    await DB.open();
    // أول تشغيل؟
    const hasAccounts=(await DB.all("accounts")).length>0;
    if(!hasAccounts){
      await seedBase();
      await seedDemo();
    }else{
      (await DB.all("accounts")).forEach(a=>{ACC_BY_CODE[a.code]=a.id;});
    }
    updateNetChip();
    Sync.init();
    $("#lgPass").addEventListener("keydown",e=>{if(e.key==="Enter")App.login();});
    if(!App.restoreSession()){$("#login").classList.remove("hidden");}
  }catch(e){
    document.body.innerHTML='<div style="padding:40px;text-align:center;font-family:Tahoma"><h2>تعذر تشغيل التطبيق</h2><p>'+esc(e.message)+'</p><p>تأكد من فتح الصفحة عبر متصفح حديث يدعم IndexedDB.</p></div>';
    console.error(e);
  }
})();

</script>
